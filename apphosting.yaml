# Settings for Cloud Run backend instances
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

# Environment variable mappings
# In production on Firebase App Hosting, sensitive secrets can also be managed via Google Secret Manager
env:
  - variable: NEXT_PUBLIC_APP_URL
    value: https://zuvapay.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: "G-1PQWBFSLXP"
    availability:
      - BUILD
      - RUNTIME
